<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Radar Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 2rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .bg-high { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .bg-medium { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .bg-low { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
        
        .meta {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }
        .score {
            font-size: 2rem;
            font-weight: 700;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Release Risk Radar</h1>
        <div id="dashboard" class="grid">
            <!-- Cards will be injected here -->
            <p>Loading analyses...</p>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('http://localhost:8002/api/pr/list');
                const prs = await response.json();
                
                const container = document.getElementById('dashboard');
                container.innerHTML = '';
                
                prs.forEach(pr => {
                    // Fetch analysis for each PR if not embedded (simplified assumption: data is here or fetched)
                    // For now, listing submitted PRs. The API structure might need adjustment to show analysis status.
                    // Assuming PR object has status.
                    
                    // Actually, let's fetch /dashboard/stats or just assume PR object structure
                    // The server endpoint /api/pr/list returns PR documents.
                    
                    const statusColor = pr.status === 'analyzed' ? 'bg-success' : 'bg-secondary';
                    const riskLevel = 'medium'; // Placeholder until linked to analysis
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:start">
                            <h3>#${pr.pr_number || '?'} ${pr.repo_name}</h3>
                            <span class="badge ${pr.status === 'analyzed' ? 'bg-low' : 'bg-medium'}">${pr.status}</span>
                        </div>
                        <p class="meta">by ${pr.author}</p>
                        <p><strong>${pr.title}</strong></p>
                    `;
                    container.appendChild(card);
                });
                
            } catch (e) {
                console.error(e);
                document.getElementById('dashboard').innerHTML = '<p style="color:red">Failed to load dashboard. Ensure server is running on port 8002.</p>';
            }
        }
        
        loadDashboard();
        setInterval(loadDashboard, 10000); // Auto-refresh
    </script>
</body>
</html>
